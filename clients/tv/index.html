<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920,height=1080">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: http: https:; script-src 'self'; connect-src http: https:; media-src http: https: blob:; style-src 'self' 'unsafe-inline'">
    <title>Torrent TV</title>
    <style>
      html,body{margin:0;width:100%;height:100%;background:var(--tt-ink,#0a0b0f);color:var(--tt-text,#f5f6f8);font-family:var(--tt-font-sans,Arial,sans-serif)}
      #startup{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px;box-sizing:border-box;text-align:center;background:var(--tt-ink,#0a0b0f);z-index:100}
      #startup-mark{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:24px;background:var(--tt-accent,#f2a93b);color:var(--tt-on-accent,#14100a)}
      #startup-mark svg{display:block;width:44px;height:44px}
      #startup h1{font-size:56px;font-weight:800;line-height:1.15;letter-spacing:-0.02em;margin:32px 0 16px;color:var(--tt-text,#f5f6f8)}
      #startup-message{font-size:30px;line-height:1.45;white-space:pre-wrap;max-width:1400px;color:var(--tt-text-muted,#c9cdd6)}
    </style>
    <link rel="stylesheet" href="app.css">
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
  </head>
  <body>
    <div id="startup"><div id="startup-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></div><h1>Torrent TV</h1><div id="startup-message">Starting application…</div></div>
    <div id="app"></div>
    <script type="text/javascript" src="fatal-error.js"></script>
    <script type="text/javascript" src="startup.js"></script>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
